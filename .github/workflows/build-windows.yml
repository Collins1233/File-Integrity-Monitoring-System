name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          npm run install:all
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-build.txt

      - name: Build frontend
        run: npm run build

      - name: Create app icon
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          src = Path("frontend/public/fim-logo.png")
          dst = Path("frontend/public/fim-logo.ico")
          img = Image.open(src).convert("RGBA")
          img.save(dst, sizes=[(16, 16), (32, 32), (48, 48), (64, 64), (128, 128), (256, 256)])
          print("wrote", dst)
          PY

      - name: Build EXE with PyInstaller
        run: python -m PyInstaller --noconfirm --clean FIMS.spec

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer (Desktop + Start Menu)
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found after Inno Setup install" }
          & $iscc installer\FIMS.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compile failed" }
          if (-not (Test-Path dist\FIMS-Setup.exe)) { throw "FIMS-Setup.exe missing" }

      - name: Stage release zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist\FIMS.exe release\FIMS.exe
          Copy-Item dist\FIMS-Setup.exe release\FIMS-Setup.exe
          @"
          File Integrity Monitoring System (FIMS)

          Recommended:
            Run FIMS-Setup.exe
            - Installs FIMS
            - Creates Start Menu shortcut
            - Optional Desktop icon
            - Adds Uninstall entry

          Portable:
            Double-click FIMS.exe (no install)

          Dashboard: http://127.0.0.1:8000
          Keep the app running while you use the dashboard.

          User data (baselines, logs, reports):
            %LOCALAPPDATA%\FIMS

          If startup fails, check fim_startup_error.txt next to the .exe
          or in the install folder.
          "@.Trim() | Set-Content -Encoding utf8 release\README.txt
          Compress-Archive -Path release\FIMS.exe,release\FIMS-Setup.exe,release\README.txt -DestinationPath FIMS-windows.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FIMS-windows
          path: |
            dist/FIMS.exe
            dist/FIMS-Setup.exe
            FIMS-windows.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FIMS.exe
            dist/FIMS-Setup.exe
            FIMS-windows.zip
          generate_release_notes: true
          body: |
            ## Windows download

            - **FIMS-Setup.exe** — recommended. Installs FIMS, Start Menu shortcut, optional Desktop icon
            - **FIMS.exe** — portable (no install)
            - **FIMS-windows.zip** — both + readme

            After install, launch **FIMS** from the Start Menu or Desktop.
            User data is stored in `%LOCALAPPDATA%\FIMS`.
