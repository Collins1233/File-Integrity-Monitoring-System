name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          npm run install:all
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-build.txt

      - name: Build frontend
        run: npm run build

      - name: Create app icon
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          src = Path("frontend/public/fim-logo.png")
          dst = Path("frontend/public/fim-logo.ico")
          img = Image.open(src).convert("RGBA")
          img.save(dst, sizes=[(16, 16), (32, 32), (48, 48), (64, 64), (128, 128), (256, 256)])
          print("wrote", dst)
          PY

      - name: Build EXE with PyInstaller
        run: python -m PyInstaller --noconfirm --clean FIMS.spec

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer (Desktop + Start Menu)
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found after Inno Setup install" }
          & $iscc installer\FIMS.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compile failed" }
          if (-not (Test-Path dist\FIMS-Setup.exe)) { throw "FIMS-Setup.exe missing" }

      - name: Code-sign EXE and installer
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PFX_BASE64)) {
            Write-Host "No WINDOWS_CERT_PFX_BASE64 secret — skipping Authenticode signing."
            Write-Host "Downloads still work; SmartScreen may show Unknown publisher until a cert is added."
            exit 0
          }
          $certPath = Join-Path $env:RUNNER_TEMP "fims-codesign.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe not found" }
          foreach ($file in @("dist\FIMS.exe", "dist\FIMS-Setup.exe")) {
            & $signtool sign /f $certPath /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /d "File Integrity Monitoring System" $file
            if ($LASTEXITCODE -ne 0) { throw "Signing failed for $file" }
            & $signtool verify /pa $file
            if ($LASTEXITCODE -ne 0) { throw "Signature verify failed for $file" }
          }
          Remove-Item $certPath -Force
          Write-Host "Signed FIMS.exe and FIMS-Setup.exe"

      - name: Stage release zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist\FIMS.exe release\FIMS.exe
          Copy-Item dist\FIMS-Setup.exe release\FIMS-Setup.exe
          @"
          File Integrity Monitoring System (FIMS) v2.0.1

          Recommended:
            Run FIMS-Setup.exe
            - Installs FIMS
            - Creates Start Menu shortcut
            - Optional Desktop icon
            - System tray icon while running (Open / Quit)

          Portable:
            Double-click FIMS.exe (no install)

          Dashboard: http://127.0.0.1:8000
          Look for the FIMS icon in the Windows system tray.

          User data (baselines, logs, reports):
            %LOCALAPPDATA%\FIMS

          If startup fails, check fim_startup_error.txt in %LOCALAPPDATA%\FIMS
          "@.Trim() | Set-Content -Encoding utf8 release\README.txt
          Compress-Archive -Path release\FIMS.exe,release\FIMS-Setup.exe,release\README.txt -DestinationPath FIMS-windows.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FIMS-windows
          path: |
            dist/FIMS.exe
            dist/FIMS-Setup.exe
            FIMS-windows.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FIMS.exe
            dist/FIMS-Setup.exe
            FIMS-windows.zip
          generate_release_notes: true
          body: |
            ## Windows download — v2.0.1

            - **FIMS-Setup.exe** — recommended. Installs FIMS, Start Menu shortcut, optional Desktop icon
            - **FIMS.exe** — portable (no install)
            - **FIMS-windows.zip** — both + readme

            ### What's new
            - System tray icon (Open Dashboard / Quit)
            - Installer with Desktop + Start Menu shortcuts
            - Authenticode signing when a certificate is configured

            After install, launch **FIMS** from the Start Menu or Desktop.
            While running, use the tray icon near the clock.
            User data: `%LOCALAPPDATA%\FIMS`
